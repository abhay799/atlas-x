[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-x"
version = "0.1.0"
description = "Autonomous AI Governance & Mission Control Fabric"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "pydantic>=2.9", "pydantic-settings>=2.5", "uvicorn>=0.30", "sqlalchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.2"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.7", "mypy>=1.13", "psycopg[binary]>=3.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["atlas"]
mypy_path = "src"
