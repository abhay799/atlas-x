services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: atlas_test
      POSTGRES_USER: atlas
      # Development-only default. Override ATLAS_POSTGRES_PASSWORD locally if needed.
      POSTGRES_PASSWORD: ${ATLAS_POSTGRES_PASSWORD:-atlas-local-only}
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas_test"]
      interval: 2s
      timeout: 5s
      retries: 15
